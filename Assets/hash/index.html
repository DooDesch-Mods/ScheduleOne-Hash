<link rel="stylesheet" href="app.css">

<div class="term">
  <div class="head">
    <span class="brand">hash</span>
    <span class="ver" id="ver">v1.0.0</span>
    <span class="spacer"></span>
    <span class="session" id="session">session:host</span>
    <span class="count" id="count">0 commands</span>
  </div>

  <div class="scroll" id="scroll"></div>

  <div class="suggest" id="suggest"></div>

  <div class="line">
    <span class="prompt" id="prompt">hash $</span>
    <!-- data-reject-first: the console key is a dead key on German and Swiss layouts, and its mark arrives in the
         field a moment after the terminal opens. Refusing it at the front is the only place it can be stopped -
         removing it afterwards drags TMP's caret to the start and scrambles the next word. -->
    <input class="input" id="input" maxlength="240" autocomplete="off"
           data-keys="Tab ArrowUp ArrowDown PageUp PageDown Ctrl+R Ctrl+L Ctrl+U Ctrl+W Ctrl+C Ctrl+D Ctrl+Backspace Ctrl+Delete"
           data-reject-first="^`&#180;~">
  </div>
</div>

<script src="app.js"></script>
